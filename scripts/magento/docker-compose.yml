# ─────────────────────────────────────────────────────────────
# stackisle — Magento test stack (separate compose project)
#
#   Browser → https://${MAGENTO_DOMAIN}
#     [aem-nginx]  (shared, SSL, INSTALL_DIR/certs/magento.crt)
#       → http://magento-web:80        (over aem-local-net)
#         [magento-web]  nginx + Magento's nginx.conf.sample
#           → magento-php:9000         [magento-php]  PHP-FPM + Composer
#               → magento-db (MariaDB) · magento-search (OpenSearch) · magento-cache (Redis)
#
# Nothing is published on host ports. Start/stop via scripts/magento/magento.sh,
# which exports the absolute paths and UID/GID used below.
# ─────────────────────────────────────────────────────────────

name: stackisle-magento

networks:
  default:
    name: stackisle-magento
  aem-local-net:
    external: true          # created by the AEM stack (make start-dispatcher)

volumes:
  db-data:
    name: stackisle-magento-db
  search-data:
    name: stackisle-magento-search
  composer-cache:
    name: stackisle-magento-composer

services:

  db:
    image: ${MAGENTO_DB_IMAGE:-mariadb:11.4}
    container_name: magento-db
    environment:
      MARIADB_DATABASE: ${MAGENTO_DB_NAME:-magento}
      MARIADB_USER: ${MAGENTO_DB_USER:-magento}
      MARIADB_PASSWORD: ${MAGENTO_DB_PASSWORD:-magento}
      MARIADB_ROOT_PASSWORD: ${MAGENTO_DB_ROOT_PASSWORD:-magento-root}
    command: ["--max_allowed_packet=64M", "--innodb_buffer_pool_size=1G"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    stop_grace_period: 2m     # let InnoDB shut down cleanly (no hard kill after 10s)
    restart: unless-stopped

  search:
    image: ${MAGENTO_OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.19.1}
    container_name: magento-search
    environment:
      discovery.type: single-node           # dev mode: no production bootstrap checks
      DISABLE_SECURITY_PLUGIN: "true"       # plain HTTP inside the private network
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${MAGENTO_OPENSEARCH_HEAP:-1g} -Xmx${MAGENTO_OPENSEARCH_HEAP:-1g}"
    volumes:
      - search-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    stop_grace_period: 2m
    restart: unless-stopped

  cache:
    image: ${MAGENTO_REDIS_IMAGE:-redis:7.2-alpine}
    container_name: magento-cache
    restart: unless-stopped

  php:
    build:
      context: ./php
      args:
        PHP_VERSION: ${MAGENTO_PHP_VERSION:-8.3}
        COMPOSER_VERSION: ${MAGENTO_COMPOSER_VERSION:-2.8}
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: stackisle/magento-php:${MAGENTO_PHP_VERSION:-8.3}
    container_name: magento-php
    volumes:
      - ${MAGENTO_SRC_DIR:-../../sdk/magento/src}:/var/www/html
      - composer-cache:/var/www/.composer
    depends_on:
      db:     { condition: service_healthy }
      search: { condition: service_healthy }
      cache:  { condition: service_started }
    restart: unless-stopped

  web:
    image: ${MAGENTO_WEB_IMAGE:-nginx:1.27-alpine}
    container_name: magento-web
    networks:
      default: {}
      aem-local-net: {}        # so aem-nginx can reach http://magento-web:80
    volumes:
      - ${MAGENTO_SRC_DIR:-../../sdk/magento/src}:/var/www/html:ro
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped

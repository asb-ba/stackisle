# ─────────────────────────────────────────────────────────────
# stackisle — Magento web server (container magento-web, plain HTTP :80)
# SSL is terminated by the shared aem-nginx, which proxies
# https://<MAGENTO_DOMAIN> → http://magento-web:80 over aem-local-net.
# Uses Magento's own nginx.conf.sample from the installed code base.
# ─────────────────────────────────────────────────────────────

upstream fastcgi_backend {
    server magento-php:9000;
}

server {
    listen 80;
    server_name _;

    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE developer;

    # Magento's recommended rules (routing, static/media, PHP handling, security)
    include /var/www/html/nginx.conf.sample;
}
